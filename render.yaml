services:
  - type: web
    name: avavault-perp-dex-api
    runtime: node
    plan: free
    buildCommand: rm -rf task7-perp-dex/matching-engine/node_modules task7-perp-dex/server/node_modules && cd task7-perp-dex/matching-engine && npm install && npm run build && cd ../server && npm install && npm rebuild better-sqlite3 --build-from-source
    startCommand: cd task7-perp-dex/server && npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: FUJI_RPC_URL
        value: https://api.avax-test.network/ext/bc/C/rpc
      - key: VAULT_ADDRESS
        value: "0x0425352bc3c5293D5629c27525969439Ab9C27b5"
      - key: VAULT_ABI_VERSION
        value: v2
      # RWA 抵押估值接入：/account/:address/margin 会读这个金库的 totalAccountValue()
      - key: MULTICOLLATERAL_VAULT_ADDRESS
        value: "0xb999cb61A4fb2FE71d1C5FBA7aD506F619dD7884"
      # 默认只展示 RWA 估值、不强制校验（避免没有保证金的访客连单都下不了）；
      # 设置 MARGIN_QUOTE_USD_PRICE（quote 代币美元价，如 WAVAX 价格）后 RWA 估值
      # 才计入可用保证金，再把 MARGIN_ENFORCE 改为 "true" 才会拦截保证金不足的买单。
      - key: MARGIN_ENFORCE
        value: "false"
      # 资金费率：默认每 8 小时一期、费率封顶 ±10bps。费率由成交 TWAP 标记价相对
      # 外部指数喂价的溢价决定；未配置 MARK_PRICE_FEED_URL 时没有独立指数价，
      # 费率保持 0、不结算（不会拿标记价和它自己比出假溢价）。
      - key: FUNDING_INTERVAL_MS
        value: "28800000"
      - key: FUNDING_MAX_BPS
        value: "10"
      - key: OPERATOR_PRIVATE_KEY
        sync: false
      # 演示做市钱包：仅用于 Fuji 测试币。要启用服务端一键铺双边盘口，
      # 需先用 demo/fund_demo_maker.mjs 让它在 VaultV2 中持有测试 mUSDC。
      - key: DEMO_MAKER_PRIVATE_KEY
        sync: false
      - key: DEMO_MID_PRICE
        value: "2500"
      - key: DEMO_LIQUIDITY_BASE_QTY
        value: "100"
      # 留空盘口仍可测算，但会标记为“配置兜底值”，不是市场行情；
      # 真实市场参考价要用成交 TWAP / 盘口或单独配置价格源。
      - key: HEDGE_FALLBACK_REF_PRICE
        value: "2500"
      # 如设为 true，服务启动时只在空盘口铺一次；默认关闭，现场可手动点“铺盘口”。
      - key: SEED_DEMO_LIQUIDITY
        value: "false"
      # 演示彩排重置/铺盘口开关：必须设置该令牌，两个 /admin 端点才会启用；
      # 绝不要提交明文。见 DEMO_RUNBOOK.md。
      - key: ADMIN_RESET_TOKEN
        sync: false
